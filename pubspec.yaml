name: my_imc_calc_app
description: A Flutter app using only Cupertino components with a custom design system.

publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  # Cupertino Icons (for iOS-style icons)
  cupertino_icons: ^1.0.8

  # State Management (Optional)
  provider: ^6.1.2 # If using Provider for state management

  # Animations & Routing (Optional)
  flutter_animate: ^4.5.0 # For smooth UI animations
  go_router: ^13.2.0 # For navigation (instead of Material's Navigator)

  # HTTP Requests (Optional)
  dio: ^5.4.1+1 # Alternative to http for API calls

  # Local Storage (Optional)
  shared_preferences: ^2.2.2 # For storing user preferences

  # Device Info & Permissions (Optional)
  device_info_plus: ^10.1.0 # For device information
  permission_handler: ^11.3.0 # For handling app permissions

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: false

